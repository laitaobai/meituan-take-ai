spring:
  application:
    name: sky-ai-chat
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://ws-in4j3efmx0r1wbth.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.8-max
      embedding:
        model: text-embedding-v4
  data:
    redis:
      port: 6379
      host: localhost
      database: 10

server:
  port: 9090

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug




